name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          architecture: arm64
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-arm64.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Verify
        run: |
          ./script/scan_sensitive.sh
          ./script/test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          architecture: arm64
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-arm64.lock
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Build ad-hoc DMG
        run: ./script/build_and_run.sh --package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/4G-Bridge-0.1.0-arm64.dmg \
            artifacts/4G-Bridge-0.1.0-arm64.dmg.sha256 \
            --title "4G Bridge $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
